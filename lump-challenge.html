<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can You Tell? | VISTA iQ Lump Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* VISTA iQ brand system (Brand Guidelines V1.0) */
  :root{
    --or:#F6892D;        /* VISTA iQ Orange */
    --or-hot:#E1720D;    /* hover state: more vibrant */
    --ink:#101820;       /* VISTA iQ Black */
    --gray:#C9CACC;      /* VISTA iQ Gray */
    --teal:#6CCAD0;      /* VISTA iQ Teal, sparing accent */
    --teal-d:#1E7F87;
    --page:#FFFFFF;
    --line:#E3E5E7;
    --mut:#5B6167;
    --lowbg:#E9F7F8; --modbg:#FDEFDD; --mod:#B3610A; --hi:#C63D33; --hibg:#FAE9E7; --okbg:#EAF6EE; --ok:#2f8a4e;
    --mono:'Andale Mono','Roboto Mono',monospace;
    --sans:'Roboto',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--page);font-family:var(--sans);color:var(--ink);line-height:1.55;
    display:flex;justify-content:center;padding:24px 16px;min-height:100vh}
  .wrap{width:100%;max-width:560px}
  /* thermal scan header, per brand visual style */
  .topbar{position:relative;overflow:hidden;border-radius:14px 14px 0 0;padding:14px 20px;display:flex;
    align-items:center;justify-content:space-between;
    background:radial-gradient(120% 160% at 15% 20%,#FFD84D 0%,#F6892D 42%,#E8480F 100%)}
  .topbar:after{content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.3px);background-size:7px 7px;pointer-events:none}
  .brand{position:relative;z-index:1;display:flex;flex-direction:column}
  .logo{font-family:var(--mono);font-weight:700;color:#fff;font-size:19px;letter-spacing:1.5px}
  .logo i{font-style:normal;color:#fff}
  .logo .sq{display:inline-block;width:6px;height:6px;background:var(--teal);margin-left:3px;vertical-align:super}
  .tag{font-family:var(--mono);color:#fff;font-size:9.5px;letter-spacing:2.5px;margin-top:2px;opacity:.92}
  .dots{position:relative;z-index:1;display:flex;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4)}
  .dot.on{background:#fff} .dot.done{background:var(--ink)}
  .card{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 16px 16px;
    padding:24px;box-shadow:0 10px 30px rgba(16,24,32,.08)}
  h1{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ink);line-height:1.18;text-transform:uppercase;letter-spacing:.5px}
  h1 .em{color:var(--or)}
  h2{font-family:var(--mono);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut)}
  .lead{color:var(--mut);font-size:15px;margin-top:10px}
  .photo{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
    aspect-ratio:4/3;background:var(--ink);margin:14px 0}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .badge{position:absolute;top:10px;left:10px;background:rgba(16,24,32,.78);color:#fff;
    font-family:var(--mono);font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:1px;text-transform:uppercase}
  .vignette{background:#F7F8F8;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .vig-row{display:flex;gap:10px;font-size:13.5px;padding:3px 0}
  .vig-row b{font-family:var(--mono);font-weight:700;min-width:100px;font-size:11px;text-transform:uppercase;
    letter-spacing:.6px;color:var(--ink);padding-top:2px}
  .vig-row span{color:#394046}
  .ask{font-size:13px;color:var(--mut);margin-bottom:10px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .choice{border:2px solid var(--line);background:#fff;border-radius:999px;padding:14px 10px;cursor:pointer;
    text-align:center;font-weight:700;font-size:15px;transition:.12s;font-family:var(--sans);color:var(--ink)}
  .choice .sub{display:block;font-weight:400;font-size:11.5px;color:var(--mut);margin-top:2px}
  .choice.benign:hover{border-color:var(--teal-d);background:var(--lowbg);color:var(--teal-d)}
  .choice.susp:hover{border-color:var(--hi);background:var(--hibg);color:var(--hi)}
  .reveal{margin-top:16px;border-radius:12px;padding:16px 18px;border:1px solid}
  .reveal.correct{background:var(--okbg);border-color:#A6D6B5}
  .reveal.wrong{background:var(--hibg);border-color:#E6A9A6}
  .reveal .rtag{font-family:var(--mono);font-weight:700;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase}
  .reveal .verdict{font-family:var(--mono);font-size:18px;font-weight:700;margin:6px 0;display:flex;
    align-items:center;gap:10px;flex-wrap:wrap;text-transform:uppercase}
  .reveal p{font-size:13.5px;color:#394046}
  .pill{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 10px;
    border-radius:20px;text-transform:uppercase;letter-spacing:.6px}
  .pill.b{background:var(--lowbg);color:var(--teal-d)}
  .pill.h{background:var(--hibg);color:var(--hi)}
  .btn{display:block;width:100%;border:none;border-radius:999px;padding:15px;font-family:var(--sans);
    font-weight:700;font-size:15px;cursor:pointer;margin-top:14px;transition:.12s;text-align:center;text-decoration:none}
  .btn-o{background:var(--or);color:#fff}.btn-o:hover{background:var(--or-hot)}
  .btn-ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
  .btn-ghost:hover{background:var(--ink);color:#fff}
  .scorebig{font-family:var(--mono);font-size:62px;font-weight:700;color:var(--or);text-align:center;line-height:1;margin-top:8px}
  .scorelbl{text-align:center;color:var(--mut);font-size:13.5px;margin-top:4px}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .stat{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .stat .big{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--ink)}
  .stat .cap{color:var(--mut);font-size:11.5px;margin-top:3px;line-height:1.45}
  .claim{position:relative;overflow:hidden;border-radius:12px;padding:18px;margin:6px 0 4px;color:#fff;
    background:radial-gradient(130% 170% at 12% 15%,#FFD84D 0%,#F6892D 45%,#E8480F 100%)}
  .claim:after{content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.3px);background-size:7px 7px;pointer-events:none}
  .claim p{position:relative;z-index:1;font-size:14.5px}
  .claim b{font-family:var(--mono)}
  form label{display:block;font-size:11.5px;font-weight:700;margin:11px 0 5px;font-family:var(--mono);
    text-transform:uppercase;letter-spacing:.8px}
  form input{width:100%;padding:12px 14px;border:1px solid var(--gray);border-radius:10px;font-size:15px;font-family:var(--sans)}
  form input:focus{outline:none;border-color:var(--or)}
  .chain{text-align:center;margin-top:14px;font-size:13px}
  .chain a{color:var(--or);font-weight:700;text-decoration:none}
  .chain a:hover{color:var(--or-hot)}
  .disc{font-size:11px;color:#9AA0A6;margin-top:14px;text-align:center;line-height:1.5}
  .fade{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">VISTA <i>iQ</i><span class="sq"></span></div>
      <div class="tag">THE NEW FIRST STEP</div>
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="card" id="stage"></div>
</div>

<script>
var HAS_FORM = false; /* variant flag: true = lead form at the end, false = CTA only */
var NEXT_SUFFIX = '';

/* Canine Mass Catalog: 29 usable cases (rows 22 and 24 excluded per catalog).
   Photos are real clinical photographs; classifications are representative teaching assignments. */
var CATALOG = [
  {n:1,  cat:'susp', truth:'Mast cell tumor', img:'images/01.jpg',
    d:'Small raised mass, 0.5 cm, round, well defined', loc:'Cranial tail',
    note:'Small, round and well defined reads as harmless. Mast cell tumors are the great pretenders and routinely present exactly like this.'},
  {n:2,  cat:'benign', truth:'Lipoma', img:'images/02.jpg',
    d:'Soft, mobile, well circumscribed subcutaneous mass', loc:'Caudal abdomen',
    note:'A true benign lipoma. Notice how little separates it from a mast cell tumor on presentation. By hand you cannot reliably tell the two apart.'},
  {n:3,  cat:'benign', truth:'Sebaceous adenoma', img:'images/03.jpg',
    d:'Subdermal, 6 cm, immobile', loc:'Left axilla',
    note:'Large and immobile pushes the gut toward cancer. This one is a benign sebaceous adenoma. Size and fixation alone can fool you in both directions.'},
  {n:4,  cat:'susp', truth:'Soft tissue sarcoma', img:'images/04.jpg',
    d:'Subdermal, nodular and soft, fixed in position', loc:'Right ventral cranial costal',
    note:'Soft and nodular feels reassuring, but fixed in position is the tell. On a busy exam that detail is exactly what gets missed.'},
  {n:5,  cat:'benign', truth:'Cyst', img:'images/05.jpg',
    d:'Subdermal, round fixed mass, 1.5 cm', loc:'Left lateral abdominal',
    note:'A fixed mass that turns out to be a simple cyst. Fixation raised the alarm here, yet the same finding in the next dog can mean sarcoma.'},
  {n:6,  cat:'susp', truth:'Mast cell tumor', img:'images/06.jpg',
    d:'Dermal mass, 2.5 cm, well circumscribed, also deep', loc:'Left medial thigh',
    note:'Well circumscribed suggests benign, but the deep component changes the picture. Mast cell tumors often live in both planes at once.'},
  {n:7,  cat:'benign', truth:'Benign epithelial mass', img:'images/07.jpg',
    d:'Uncircumscribed, 2 cm, deep', loc:'Right lateral cranial costal',
    note:'Uncircumscribed and deep sounds like a sarcoma workup. It is benign epithelial tissue. The scary feel does not equal a scary answer.'},
  {n:8,  cat:'benign', truth:'Lipoma', img:'images/08.jpg',
    d:'Smooth pink protruding pedunculated nodule, 1 cm', loc:'Left dorsal middle costal',
    note:'An unusual look for a lipoma, which is the point. Even the most common benign mass does not always present the way the textbook says.'},
  {n:9,  cat:'susp', truth:'Soft tissue sarcoma', img:'images/09.jpg',
    d:'Densely dark haired skin, follicular stippling, no distinct mass visible', loc:'Caudal tail',
    note:'Nothing distinct to see or feel, and still a sarcoma underneath. The cases that never look like cases are the ones that cost the most.'},
  {n:10, cat:'benign', truth:'Sebaceous adenoma', img:'images/10.jpg',
    d:'Subdermal, circumscribed, mobile, 2 cm', loc:'Head',
    note:'Circumscribed and mobile, and genuinely benign this time. The problem is the identical mass on the next table that is not.'},
  {n:11, cat:'susp', truth:'Mast cell tumor', img:'images/11.jpg',
    d:'3 cm, mobile, subdermal', loc:'Mid chest',
    note:'Mobile and subcutaneous is the classic lipoma story. This one is a mast cell tumor wearing the costume.'},
  {n:12, cat:'benign', truth:'Cyst', img:'images/12.jpg',
    d:'0.5 cm nodule, subdermal, mobile', loc:'Right ventral cranial costal',
    note:'Tiny, mobile and benign. Correct call or lucky call? Without testing, there is no way to know which one you just made.'},
  {n:13, cat:'benign', truth:'Lipoma', img:'images/13.jpg',
    d:'Small pink raised nodule, 1 cm', loc:'Right lateral abdominal',
    note:'A pink raised nodule can be a histiocytoma, a mast cell tumor or this harmless lipoma. Same look, three very different outcomes.'},
  {n:14, cat:'susp', truth:'Soft tissue sarcoma', img:'images/14.jpg',
    d:'Present for 2 months, 2 cm, raised', loc:'Lower left front limb',
    note:'Two months of no drama earns a lot of masses a pass. Plenty of sarcomas grow slowly. Time is not a diagnosis.'},
  {n:15, cat:'benign', truth:'Benign epithelial mass', img:'images/15.jpg',
    d:'2 cm mobile mass', loc:'Left abdomen',
    note:'Mobile, modest, unremarkable, and benign. The exam impression happened to be right. The catalog is full of twins where it is not.'},
  {n:16, cat:'susp', truth:'Mast cell tumor', img:'images/16.jpg',
    d:'3 cm, hard, dermal and subdermal, crusted eroded spot', loc:'Right ventral caudal middle abdominal',
    note:'The crusting and erosion are flags, and here they are real. But plenty of mast cell tumors show none of these signs at all.'},
  {n:17, cat:'benign', truth:'Cyst', img:'images/17.jpg',
    d:'1.5 cm smooth pink raised nodule, fast growing over 4 weeks', loc:'Right fore upper medial',
    note:'Fast growth screams cancer to the gut. It is a benign cyst. Speed fools you one way just as stillness fools you the other.'},
  {n:18, cat:'benign', truth:'Sebaceous adenoma', img:'images/18.jpg',
    d:'4 cm fast growing mass, hard', loc:'Right ventral middle costal',
    note:'Large, hard and growing fast, and still benign. If this one went straight to the worry pile, the exam is running on instinct, not data.'},
  {n:19, cat:'susp', truth:'Soft tissue sarcoma', img:'images/19.jpg',
    d:'Subdermal, fixed, 1.5 cm', loc:'Right lateral caudal costal',
    note:'Small and quiet, but fixed. A 1.5 cm sarcoma found now is a very different surgery than the same sarcoma found at 5 cm.'},
  {n:20, cat:'benign', truth:'Lipoma', img:'images/20.jpg',
    d:'Subdermal, hard, 2 cm, immobile', loc:'Right cranial gluteal',
    note:'Hard and immobile, the textbook red flags, attached to a completely benign lipoma. Palpation keeps both kinds of secrets.'},
  {n:21, cat:'susp', truth:'Mast cell tumor', img:'images/21.jpg',
    d:'Subdermal, 6 cm, mobile, soft', loc:'Right lateral caudal costal',
    note:'Six centimeters of soft, mobile tissue that feels exactly like fat. This is the mast cell tumor that gets sent home as a lipoma.'},
  {n:23, cat:'benign', truth:'Cyst', img:'images/23.jpg',
    d:'1 cm small pink flat topped lesion', loc:'Left sacral',
    note:'A small pink lesion with a dozen possible identities. This one is a cyst. The point is that the eye alone cannot rank those possibilities.'},
  {n:25, cat:'benign', truth:'Cyst', img:'images/25.jpg',
    d:'3 cm ulcerated red crusted nodule', loc:'Right cranial lumbar',
    note:'Ulcerated, red and crusted, and benign. The angriest looking mass can be the harmless one. Looks lie in both directions.'},
  {n:26, cat:'susp', truth:'Mast cell tumor', img:'images/26.jpg',
    d:'Subdermal, soft, mobile, well circumscribed', loc:'Left axilla',
    note:'Soft, mobile, well circumscribed. Every word of that description says benign, and every word of it fits this mast cell tumor.'},
  {n:27, cat:'benign', truth:'Sebaceous adenoma', img:'images/27.jpg',
    d:'Dermal nodule, 1.5 cm', loc:'Left medial knee',
    note:'An unremarkable dermal nodule that is exactly what it looks like. The trouble is that the remarkable ones read the same way.'},
  {n:28, cat:'benign', truth:'Benign epithelial mass', img:'images/28.jpg',
    d:'Subdermal, 2 cm, immobile, soft', loc:'Right ventral caudal abdominal',
    note:'Immobile usually pushes the call toward suspicious. Benign this time. Elsewhere in this catalog the same immobile, fixed feel belongs to a sarcoma.'},
  {n:29, cat:'susp', truth:'Soft tissue sarcoma', img:'images/29.jpg',
    d:'2.5 cm mass, circumscribed, soft, dermal', loc:'Right caudal lumbar',
    note:'Circumscribed and soft in the skin, and still a sarcoma. The reassuring adjectives are the most dangerous ones in the record.'},
  {n:30, cat:'benign', truth:'Cyst', img:'images/30.jpg',
    d:'Subdermal, 0.5 cm, hard nodule', loc:'Left rear limb',
    note:'A hard little nodule that amounts to nothing. Correct. But hard and little is also how some mast cell tumors introduce themselves.'},
  {n:31, cat:'susp', truth:'Mast cell tumor', img:'images/31.jpg',
    d:'Subdermal, 3 cm, soft, mobile', loc:'Left dorsal middle costal',
    note:'Soft and mobile, the two most comforting words in the exam room, attached one more time to a mast cell tumor.'}
];

/* Draw 6 different cases each session: 3 benign, 3 suspicious, shuffled */
/* Branded thermal-scan placeholder, shown only if a photo file is missing */
function phSvg(){
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">'+
    '<defs><radialGradient id="g" cx="30%" cy="25%" r="110%">'+
    '<stop offset="0%" stop-color="#FFD84D"/><stop offset="45%" stop-color="#F6892D"/><stop offset="100%" stop-color="#E8480F"/></radialGradient>'+
    '<radialGradient id="m" cx="50%" cy="50%" r="50%">'+
    '<stop offset="0%" stop-color="#7A1FA0" stop-opacity=".85"/><stop offset="70%" stop-color="#B23B77" stop-opacity=".55"/><stop offset="100%" stop-color="#B23B77" stop-opacity="0"/></radialGradient></defs>'+
    '<rect width="320" height="240" fill="url(#g)"/>'+
    '<ellipse cx="176" cy="132" rx="74" ry="52" fill="url(#m)"/>'+
    '<text x="160" y="222" text-anchor="middle" font-family="monospace" font-size="12" fill="#FFFFFF" opacity=".9">SCAN VIEW &#183; PHOTO LOADING</text>'+
    '</svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* Probe which case photos actually exist, then build each round ONLY from real photos.
   New photos dropped into images/ are picked up automatically on the next load. */
var CASES=[];
function probeCatalog(done){
  var pending=CATALOG.length, avail=[];
  CATALOG.forEach(function(c){
    var im=new Image(), settled=false;
    function fin(ok){ if(settled)return; settled=true; if(ok)avail.push(c); if(--pending===0)done(avail); }
    im.onload=function(){fin(true)}; im.onerror=function(){fin(false)};
    setTimeout(function(){fin(false)},5000);
    im.src=c.img;
  });
}
function buildRound(avail){
  var pool = avail.length ? avail : CATALOG; /* fallback: all cases with branded scan visual */
  var b=shuffle(pool.filter(function(c){return c.cat==='benign';}));
  var s=shuffle(pool.filter(function(c){return c.cat==='susp';}));
  var nb=Math.min(3,b.length), ns=Math.min(3,s.length);
  /* top up from the larger side so a round is always as full as the photo set allows (max 6) */
  var round=b.slice(0,nb).concat(s.slice(0,ns));
  var extra=b.slice(nb).concat(s.slice(ns));
  while(round.length<6 && extra.length){round.push(extra.shift());}
  return shuffle(round);
}

var idx=0, score=0, answered=false;
var SRC=new URLSearchParams(location.search).get('utm_source')||'direct';
var stage=document.getElementById('stage'), dotsEl=document.getElementById('dots');

function renderDots(){
  dotsEl.innerHTML='';
  for(var i=0;i<CASES.length;i++){var d=document.createElement('div');
    d.className='dot'+(i<idx?' done':(i===idx?' on':''));dotsEl.appendChild(d);}
}
function row(k,v){return '<div class="vig-row"><b>'+k+'</b><span>'+v+'</span></div>';}

function renderCase(){
  answered=false; renderDots();
  var c=CASES[idx];
  stage.className='card fade';
  stage.innerHTML=
    '<h2>Case '+(idx+1)+' of '+CASES.length+'</h2>'+
    '<div class="photo"><div class="badge">Case file '+String(c.n).padStart(2,'0')+'</div>'+
      '<img src="'+c.img+'" alt="Clinical photograph of a canine mass" loading="eager" '+
      'onerror="this.onerror=null;this.src=phSvg();"></div>'+
    '<div class="vignette">'+row('On exam',c.d)+row('Location',c.loc)+'</div>'+
    '<p class="ask">Your call, by sight and feel alone:</p>'+
    '<div class="choices">'+
      '<button type="button" class="choice benign" onclick="answer(\'benign\')">Benign<span class="sub">Monitor at home</span></button>'+
      '<button type="button" class="choice susp" onclick="answer(\'susp\')">Suspicious<span class="sub">Investigate now</span></button>'+
    '</div>';
}

function answer(choice){
  if(answered)return; answered=true;
  var c=CASES[idx], correct=(choice===c.cat); if(correct)score++;
  var rev=document.createElement('div');
  rev.className='reveal '+(correct?'correct':'wrong')+' fade';
  rev.innerHTML='<span class="rtag" style="color:'+(correct?'var(--ok)':'var(--hi)')+'">'+
    (correct?'You got it':'Most vets miss this')+'</span>'+
    '<div class="verdict">'+c.truth+'<span class="pill '+(c.cat==='benign'?'b':'h')+'">'+
      (c.cat==='benign'?'Benign':'Suspicious')+'</span></div><p>'+c.note+'</p>';
  stage.querySelector('.choices').replaceWith(rev);
  var btn=document.createElement('button');
  btn.className='btn btn-o';
  btn.textContent=idx<CASES.length-1?'Next case':'See my result';
  btn.onclick=function(){idx++;idx<CASES.length?renderCase():renderResult();};
  stage.appendChild(btn);
}

function renderResult(){
  renderDots(); stage.className='card fade';
  var endBlock;
    endBlock=
      '<div style="margin-top:12px">'+
        '<a class="btn btn-o" href="https://ht-vet.com/talk-to-sales/?utm_source=lump_challenge&utm_medium=tool&utm_campaign=vista_tools">Book a Lunch &amp; Learn</a>'+
        '<button class="btn btn-ghost" onclick="shareChallenge()">Challenge a colleague to beat my score</button>'+
        '<p class="chain"><a href="roi-calculator'+NEXT_SUFFIX+'.html?utm_source=lump_challenge">See what scanning these lumps is worth at your clinic &rsaquo;</a></p>'+
      '</div>';
  stage.innerHTML=
    '<h1>You had to <span class="em">guess.</span></h1>'+
    '<p class="lead">And guessing is the problem. Here is how you did:</p>'+
    '<div class="scorebig">'+score+'/'+CASES.length+'</div>'+
    '<div class="scorelbl">cases called correctly by sight and feel</div>'+
    '<div class="statgrid">'+
      '<div class="stat"><div class="big">39%</div><div class="cap">of lumps on dogs ever get tested</div></div>'+
      '<div class="stat"><div class="big">15%</div><div class="cap">of lumps are malignant</div></div>'+
    '</div>'+
    '<div class="claim"><p>VISTA iQ rules out cancer <b>in the scanned mass</b> with <b>98% NPV</b>, in a <b>40 second scan</b>. No guessing, no unnecessary aspirate, an answer in the room.</p></div>'+
    endBlock+
    '<p class="disc">Teaching cases built on real clinical photographs; classifications are representative. For veterinary education, not a diagnostic tool. &copy; HT Vet &middot; VISTA iQ</p>';
}


function shareChallenge(){
  var txt='I scored '+score+'/'+CASES.length+' telling benign lumps from cancer by sight and feel. Can you beat me? '+location.origin+location.pathname;
  if(navigator.share){navigator.share({title:'VISTA iQ Lump Challenge',text:txt}).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt);alert('A challenge message was copied. Paste it to a colleague.');}
}
